name: Verify published benchmark
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python privacy_check.py
      - run: python summarize.py && python render_report.py
      - run: git diff --exit-code -- README.md docs/QUICK_TABLE_ZH.md RESULTS.md results/v1/summary.json results/v1/comparison.csv
